name: Проверка и публикация РИТМ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Проверить правила и защиту синхронизации
        run: dotnet test --configuration Release
      - name: Собрать PWA для пути репозитория
        shell: pwsh
        run: ./scripts/publish.ps1 -BasePath "/${{ github.event.repository.name }}/"
      - name: Подготовить артефакт Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Подготовить Pages
        uses: actions/configure-pages@v5
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
